<!DOCTYPE html>
<html lang="en">  
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors</title>
    </head>
    
    <body>
        <script src="rock-paper-scissors.js" defer></script>

        <div>
            <h1>----ROCK-PAPER-SCISSORS----</h1>
            <p class="result-box">Make a selection and play a round!</p>
            <p>Round wins:</p>
            <p>
                Computer: <b class="computer-win-counter">0</b>
            </p>
            <p>
                Player: <b class="player-win-counter">0</b>
            </p>
        </div>
        
        <div class="selection-bar">
            <p class="bar-title">Make your selection!</p>
            <button class="bar-button" id="rock">Select Rock</button>
            <button class="bar-button" id="paper">Select Paper</button>
            <button class="bar-button" id="scissors">Select Scissors</button>
        </div>

        <div class="game-control-wrapper">
            <button class="play-button">Play Round!</button>
            <button class="reset-button">Reset Game</button>
        </div>

    </body>

</html>
